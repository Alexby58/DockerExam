version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: rrhh_database
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rrhh_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: rrhh_api
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: ${PORT}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - rrhh_net

  web:
    build: ./web
    container_name: rrhh_web
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - rrhh_net

networks:
  rrhh_net:
    driver: bridge

volumes:
  db_data: